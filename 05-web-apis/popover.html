<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo de Popover</title>
</head>
<body>
  <h1>Popover</h1>
  <button popovertarget="ayuda">Mostrar ayuda</button>
  <div id="ayuda" popover>
    Este contenido puede mostrarse y ocultarse desde el botón.
  </div>
</body>
</html>
