<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo de SVG</title>
</head>
<body>
  <h1>Un círculo dibujado con SVG</h1>
  <svg viewBox="0 0 120 100" width="240" role="img" aria-labelledby="titulo">
    <title id="titulo">Círculo azul sobre fondo claro</title>
    <rect width="120" height="100" fill="#eeeeee"></rect>
    <circle cx="60" cy="50" r="32" fill="royalblue"></circle>
  </svg>
</body>
</html>
