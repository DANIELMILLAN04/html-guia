<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplos multimedia</title>
</head>
<body>
  <h1>Vídeo</h1>
  <video controls width="480" preload="metadata">
    <source src="video.mp4" type="video/mp4">
    <track src="subtitulos-es.vtt" kind="subtitles" srclang="es" label="Español">
    Tu navegador no puede reproducir este vídeo.
  </video>

  <h1>Audio</h1>
  <audio controls preload="metadata">
    <source src="audio.mp3" type="audio/mpeg">
    Tu navegador no puede reproducir este audio.
  </audio>
  <p>Para probarlo, coloca tus propios archivos junto a este documento.</p>
</body>
</html>
