<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vídeo incrustado</title>
</head>
<body>
  <h1>Vídeo de YouTube</h1>
  <iframe
    width="560"
    height="315"
    src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
    title="Vídeo explicativo"
    loading="lazy"
    allowfullscreen>
  </iframe>
  <p>Sustituye <code>VIDEO_ID</code> por el identificador del vídeo que tengas permiso para insertar.</p>
</body>
</html>
